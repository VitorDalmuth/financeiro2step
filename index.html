<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2STEP · Caixa e Projeção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0A0C10; --slab:#12161E; --slab2:#191F2A; --slab3:#1F2734;
  --line:#262D3A; --line2:#333C4D;
  --ink:#E8ECF4; --mute:#7C8798; --mute2:#5A6475;
  --volt:#7C5CFF; --volt-dim:rgba(124,92,255,.14);
  --mint:#34D399; --mint-dim:rgba(52,211,153,.13);
  --coral:#FB7185; --coral-dim:rgba(251,113,133,.13);
  --amber:#FBBF24; --amber-dim:rgba(251,191,36,.13);
  --cyan:#22D3EE;
  --r:10px;
  --disp:'Space Grotesk',sans-serif;
  --body:'Plus Jakarta Sans',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--body);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;outline:none}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--volt);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hidden{display:none !important}

/* ===== LOGIN ===== */
#login{position:fixed;inset:0;background:var(--void);display:flex;align-items:center;justify-content:center;z-index:900}
.lg-box{width:100%;max-width:340px;padding:0 24px;text-align:center}
.lg-mark{font-family:var(--disp);font-weight:700;font-size:38px;letter-spacing:-.04em;margin-bottom:4px}
.lg-mark span{color:var(--volt)}
.lg-sub{color:var(--mute);font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:34px}
.lg-in{width:100%;background:var(--slab);border:1px solid var(--line);border-radius:var(--r);padding:15px;text-align:center;font-family:var(--mono);font-size:22px;letter-spacing:.42em;text-indent:.42em}
.lg-in:focus{border-color:var(--volt)}
.lg-btn{width:100%;margin-top:12px;background:var(--volt);color:#fff;font-weight:600;padding:14px;border-radius:var(--r)}
.lg-f{width:100%;background:var(--slab);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;font-size:14px;margin-bottom:9px}
.lg-f:focus{border-color:var(--volt)}
.lg-err{color:var(--coral);font-size:12px;margin-top:12px;min-height:16px;line-height:1.45}
.lg-note{color:var(--mute2);font-size:11.5px;margin-top:16px;line-height:1.5}

/* ===== SHELL ===== */
#app{display:flex;min-height:100vh}
#nav{width:216px;flex-shrink:0;background:var(--slab);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.nv-top{padding:22px 20px 18px;border-bottom:1px solid var(--line)}
.nv-mark{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:-.03em}
.nv-mark span{color:var(--volt)}
.nv-tag{font-size:10px;color:var(--mute2);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.nv-list{flex:1;padding:12px 10px;overflow-y:auto}
.nv-sec{font-size:9.5px;color:var(--mute2);letter-spacing:.14em;text-transform:uppercase;padding:14px 10px 6px}
.nv-i{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;color:var(--mute);font-weight:500;font-size:13.5px;text-align:left;transition:.13s}
.nv-i:hover{background:var(--slab2);color:var(--ink)}
.nv-i.on{background:var(--volt-dim);color:var(--ink)}
.nv-i.on .nv-d{background:var(--volt)}
.nv-d{width:5px;height:5px;border-radius:50%;background:var(--line2);flex-shrink:0}
.nv-badge{margin-left:auto;background:var(--coral);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;font-family:var(--mono)}
.nv-foot{padding:12px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--mute2);display:flex;justify-content:space-between;align-items:center}
.nv-foot button{color:var(--mute2);font-size:11px}
.nv-foot button:hover{color:var(--coral)}

#main{flex:1;min-width:0;padding:26px 32px 70px}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.hd h1{font-family:var(--disp);font-size:25px;font-weight:600;letter-spacing:-.025em}
.hd p{color:var(--mute);font-size:13px;margin-top:3px}
.hd-act{display:flex;gap:8px;flex-wrap:wrap}

/* ===== BOTOES ===== */
.btn{background:var(--slab2);border:1px solid var(--line);padding:9px 15px;border-radius:8px;font-weight:600;font-size:13px;transition:.13s;white-space:nowrap}
.btn:hover{background:var(--slab3);border-color:var(--line2)}
.btn-p{background:var(--volt);border-color:var(--volt);color:#fff}
.btn-p:hover{background:#8f72ff;border-color:#8f72ff}
.btn-d{color:var(--coral)}
.btn-d:hover{background:var(--coral-dim);border-color:var(--coral)}
.btn-s{padding:6px 11px;font-size:12px;border-radius:7px}

/* ===== CARDS ===== */
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--slab);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi-l{font-size:10.5px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;font-weight:600;display:flex;align-items:center;gap:6px}
.kpi-v{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:9px;line-height:1}
.kpi-s{font-size:11.5px;color:var(--mute);margin-top:7px;line-height:1.45}
.pos{color:var(--mint)} .neg{color:var(--coral)} .warn{color:var(--amber)} .vlt{color:var(--volt)} .cyn{color:var(--cyan)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}

/* ===== RUNWAY STRIP (assinatura) ===== */
.rw{background:var(--slab);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 14px;margin-bottom:12px}
.rw-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.rw-t{font-family:var(--disp);font-size:14px;font-weight:600;letter-spacing:-.01em}
.rw-leg{font-size:11px;color:var(--mute);display:flex;gap:14px}
.rw-leg i{display:flex;align-items:center;gap:5px;font-style:normal}
.rw-track{display:flex;gap:3px;align-items:flex-end;height:120px}
.rw-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;cursor:default}
.rw-bar{width:100%;border-radius:3px 3px 0 0;min-height:3px;transition:.2s;position:relative}
.rw-col:hover .rw-bar{filter:brightness(1.35)}
.rw-zero{height:1px;background:var(--line2);margin:0 0 -1px}
.rw-lbl{display:flex;gap:3px;margin-top:8px}
.rw-lbl div{flex:1;text-align:center;font-family:var(--mono);font-size:9.5px;color:var(--mute2);text-transform:uppercase}
.rw-lbl div.now{color:var(--volt);font-weight:700}
.tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--slab3);border:1px solid var(--line2);border-radius:7px;padding:8px 10px;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:.13s;z-index:20;box-shadow:0 8px 22px rgba(0,0,0,.5)}
.rw-col:hover .tip{opacity:1}
.tip b{font-family:var(--mono)}

/* ===== TABELAS ===== */
.tw{background:var(--slab);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tw-hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tw-t{font-family:var(--disp);font-size:14px;font-weight:600}
.tsc{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 14px;font-size:10px;color:var(--mute2);letter-spacing:.1em;text-transform:uppercase;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--slab)}
td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--slab2)}
.tr{text-align:right}
.tc{text-align:center}
.nm{font-weight:600}
.sub{font-size:11.5px;color:var(--mute);margin-top:2px}
.empty{padding:44px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-family:var(--disp);font-size:15px;margin-bottom:6px;font-weight:600}

/* ===== PILLS ===== */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.p-on{background:var(--mint-dim);color:var(--mint)}
.p-av{background:var(--amber-dim);color:var(--amber)}
.p-off{background:var(--slab3);color:var(--mute)}
.p-vl{background:var(--volt-dim);color:#a78bfa}
.p-cr{background:var(--coral-dim);color:var(--coral)}
.p-cy{background:rgba(34,211,238,.13);color:var(--cyan)}

/* ===== ALERTAS ===== */
.al{display:flex;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.al:last-child{border-bottom:none}
.al-ic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;font-weight:700}
.al-b{flex:1;min-width:0}
.al-t{font-weight:600;font-size:13px}
.al-s{font-size:11.5px;color:var(--mute);margin-top:2px}

/* ===== FORMS ===== */
.fg{margin-bottom:14px}
.fl{display:block;font-size:11px;color:var(--mute);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.fi{width:100%;background:var(--slab2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px}
.fi:focus{border-color:var(--volt);background:var(--slab3)}
select.fi{cursor:pointer}
textarea.fi{resize:vertical;min-height:64px;font-family:inherit}
.fr{display:grid;gap:12px}
.fr2{grid-template-columns:1fr 1fr}
.fr3{grid-template-columns:1fr 1fr 1fr}
.hint{font-size:11px;color:var(--mute2);margin-top:5px;line-height:1.4}
.chk{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--slab2);border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px}
.chk:hover{border-color:var(--line2)}
.chk input{width:15px;height:15px;accent-color:var(--volt);cursor:pointer}
.chk.on{border-color:var(--volt);background:var(--volt-dim)}

/* ===== MODAL ===== */
.mk{position:fixed;inset:0;background:rgba(6,8,12,.82);backdrop-filter:blur(3px);z-index:800;display:flex;align-items:flex-start;justify-content:center;padding:38px 18px;overflow-y:auto}
.md{background:var(--slab);border:1px solid var(--line2);border-radius:14px;width:100%;max-width:600px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.md-lg{max-width:820px}
.md-hd{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.md-t{font-family:var(--disp);font-size:17px;font-weight:600}
.md-x{color:var(--mute);font-size:22px;line-height:1;padding:0 4px}
.md-x:hover{color:var(--ink)}
.md-b{padding:20px 22px;max-height:calc(100vh - 220px);overflow-y:auto}
.md-f{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}

/* ===== MISC ===== */
.seg{display:inline-flex;background:var(--slab2);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{padding:6px 13px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--volt);color:#fff}
.bar{height:5px;background:var(--slab3);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.note{background:var(--amber-dim);border:1px solid rgba(251,191,36,.3);border-radius:8px;padding:11px 13px;font-size:12.5px;color:#fcd34d;margin-bottom:14px;line-height:1.5}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--slab3);border:1px solid var(--line2);border-radius:9px;padding:12px 20px;font-size:13px;font-weight:600;z-index:950;opacity:0;transition:.24s;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.mtot{display:flex;gap:26px;flex-wrap:wrap;padding:14px 16px;background:var(--slab2);border-top:1px solid var(--line)}
.mtot div span{display:block;font-size:10px;color:var(--mute2);letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.mtot div b{font-family:var(--mono);font-size:16px;font-weight:700}
.sw{position:relative;display:inline-block;width:38px;height:21px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:var(--slab3);border-radius:21px;transition:.18s;cursor:pointer;border:1px solid var(--line2)}
.sw i:before{content:"";position:absolute;width:15px;height:15px;left:2px;top:2px;background:var(--mute);border-radius:50%;transition:.18s}
.sw input:checked + i{background:var(--mint-dim);border-color:var(--mint)}
.sw input:checked + i:before{transform:translateX(17px);background:var(--mint)}
/* ===== PORTAL ===== */
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pc{background:var(--slab);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:.14s;text-align:left;width:100%;display:block}
.pc:hover{border-color:var(--volt);background:var(--slab2);transform:translateY(-2px)}
.pc-n{font-family:var(--disp);font-size:15px;font-weight:600;letter-spacing:-.01em;margin-bottom:3px}
.pc-s{font-size:11.5px;color:var(--mute)}
.pc-t{display:flex;gap:4px;margin-top:11px;flex-wrap:wrap}
.pc-c{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--slab3);color:var(--mute);font-weight:600}
.pc-v{margin-top:12px;font-family:var(--mono);font-size:19px;font-weight:700}
.lk{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}
.lk:last-child{border-bottom:none}
.lk:hover{background:var(--slab2)}
.lk.off{opacity:.42}
.lk-i{width:32px;height:32px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:13px;overflow:hidden}
.lk-i img{width:18px;height:18px}
.lk-b{flex:1;min-width:0}
.lk-n{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.lk-u{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);margin-top:2px}
.lk-o{font-size:11.5px;color:var(--amber);margin-top:4px;line-height:1.45}
.lk-a{display:flex;gap:5px;flex-shrink:0}
.lk-a a{text-decoration:none}
.ib{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--slab2);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mute);transition:.13s}
.ib:hover{background:var(--slab3);color:var(--ink);border-color:var(--line2)}
.ib.d:hover{color:var(--coral);border-color:var(--coral);background:var(--coral-dim)}
.bk{display:inline-flex;align-items:center;gap:7px;color:var(--mute);font-size:13px;font-weight:600;margin-bottom:14px}
.bk:hover{color:var(--ink)}
.sr{width:100%;max-width:280px;background:var(--slab2);border:1px solid var(--line);border-radius:8px;padding:9px 13px;font-size:13px}
.sr:focus{border-color:var(--volt)}
.mb12{margin-bottom:12px} .mb18{margin-bottom:18px} .mt12{margin-top:12px} .mt18{margin-top:18px}
.flx{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sp{justify-content:space-between}

@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){
  #app{flex-direction:column}
  #nav{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line)}
  .nv-top,.nv-foot{display:none}
  .nv-list{display:flex;padding:8px;gap:4px}
  .nv-sec{display:none}
  .nv-i{white-space:nowrap;padding:8px 12px}
  #main{padding:18px 14px 60px}
  .g4,.g3,.g2,.fr2,.fr3{grid-template-columns:1fr}
  .hd h1{font-size:21px}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<div id="login">
  <div class="lg-box">
    <div class="lg-mark">2<span>STEP</span></div>
    <div class="lg-sub">Caixa &amp; Projeção</div>
    <input type="email" class="lg-f" id="email" autocomplete="username" placeholder="seu e-mail">
    <input type="password" class="lg-f" id="senha" autocomplete="current-password" placeholder="sua senha">
    <button class="lg-btn" id="btEntrar" onclick="tryLogin()">Entrar</button>
    <div class="lg-err" id="pinErr"></div>
    <div class="lg-note" id="lgNote"></div>
  </div>
</div>

<div id="app" class="hidden">
  <nav id="nav">
    <div class="nv-top">
      <div class="nv-mark">2<span>STEP</span></div>
      <div class="nv-tag">Caixa &amp; Projeção</div>
    </div>
    <div class="nv-list">
      <div class="nv-sec">Visão</div>
      <button class="nv-i on" data-v="dash" onclick="go('dash')"><i class="nv-d"></i>Painel<span class="nv-badge hidden" id="nbAl"></span></button>
      <button class="nv-i" data-v="proj" onclick="go('proj')"><i class="nv-d"></i>Projeção</button>
      <button class="nv-i" data-v="sim" onclick="go('sim')"><i class="nv-d"></i>Simulador</button>
      <div class="nv-sec">Clientes</div>
      <button class="nv-i" data-v="portal" onclick="go('portal')"><i class="nv-d"></i>Portal de mídias</button>
      <div class="nv-sec">Cadastros</div>
      <button class="nv-i" data-v="cli" onclick="go('cli')"><i class="nv-d"></i>Clientes</button>
      <button class="nv-i" data-v="cus" onclick="go('cus')"><i class="nv-d"></i>Custos</button>
      <div class="nv-sec">Operação</div>
      <button class="nv-i" data-v="mes" onclick="go('mes')"><i class="nv-d"></i>Fechamento<span class="nv-badge hidden" id="nbMes"></span></button>
      <button class="nv-i" data-v="marg" onclick="go('marg')"><i class="nv-d"></i>Margem por cliente</button>
      <button class="nv-i" data-v="cfg" onclick="go('cfg')"><i class="nv-d"></i>Parâmetros</button>
    </div>
    <div class="nv-foot">
      <span id="dbState" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px">·</span>
      <button onclick="lock()">Sair</button>
    </div>
  </nav>
  <main id="main"></main>
</div>

<div id="modal"></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="portal.js"></script>
<script src="app.js"></script>

</body>
</html>
